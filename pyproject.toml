[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-stay-forecast"
version = "0.1.0"
description = "Predict hospital length of stay at admission from NY SPARCS 2024 discharges."
requires-python = ">=3.12"

[tool.setuptools]
packages = ["src"]
